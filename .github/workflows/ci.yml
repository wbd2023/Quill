name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
permissions:
  contents: read

jobs:
  verify:
    name: Build, Test, And Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Verify module
        run: go mod verify

      - name: Install pinned style tools
        run: make style-install

      - name: Run strict style gate
        run: make lint

      - name: Run Go tests
        run: make test

      - name: Run go vet
        run: go vet ./...

      - name: Build Quill with VCS metadata
        run: GOFLAGS=-buildvcs=true make build

      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$(./bin/quill version)" = "$GITHUB_REF_NAME"

  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install actionlint
        # Fixed tool version installed outside the module so go.mod is not modified.
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install shellcheck
        # Match the ShellCheck pinned in quill.toml (0.10.0) so PR-time checking uses the same
        # version the local style gate uses.
        run: |
          set -euo pipefail
          version="0.10.0"
          checksum="6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}"
          curl -fsSL "${url}/${archive}" -o "${archive}"
          echo "${checksum}  ${archive}" | sha256sum -c -
          tar -xf "${archive}"
          install -D -m 0755 "shellcheck-v${version}/shellcheck" "${HOME}/.local/bin/shellcheck"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Run actionlint
        # actionlint checks workflow syntax and invokes shellcheck on every `run:` script. SC2154
        # (unassigned variable) is excluded because GitHub Actions injects GITHUB_* and runner env
        # vars that shellcheck cannot see; they are external to each script.
        env:
          SHELLCHECK_OPTS: "-e SC2154"
        run: actionlint

  race:
    name: Race detector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race tests
        run: make test-race

  windows:
    name: Test (windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Build Quill
        run: go build ./cmd/quill
