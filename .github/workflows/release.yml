name: Release

# Tagged-release cross-platform binary delivery.
# Triggered only by version tags (matches the CI gate in ci.yml).
on:
  push:
    tags:
      - "v*"

# Least privilege: the workflow holds read-only access by default. Only the
# publish job escalates to contents:write (job-level) so it can create the
# GitHub release. No PAT or secret is required; the built-in GITHUB_TOKEN is
# used throughout.
permissions:
  contents: read

# A tag maps to a single release. Never cancel a publish in flight; queue any
# concurrent run instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false


jobs:
  quality:
    name: Required quality gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and smoke-test (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # Every declared platform is built and executed on its NATIVE runner.
        # A platform is published only after its own executable runs there; no
        # platform is supported merely because Quill cross-compiles for it.
        # GOOS/GOARCH are set explicitly so a runner/arch mismatch would fail
        # the native smoke step rather than silently cross-compiling.
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            archive: tar.gz
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            runner: macos-14
            archive: tar.gz
          - goos: windows
            goarch: amd64
            runner: windows-latest
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          bin_name="quill"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            bin_name="quill.exe"
          fi
          archive="quill_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}"

          mkdir -p staging
          # CGO disabled so every target is a portable, fully static binary.
          # -buildvcs embeds VCS metadata so the binary reports the tag as its
          # version (this is what `quill version` reads via debug.ReadBuildInfo).
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 \
            GOFLAGS=-buildvcs=true go build -trimpath -o "staging/${bin_name}" ./cmd/quill

          # The binary's embedded module version must equal the pushed tag; this
          # guarantees the archive name and the reported version agree.
          embedded="$(go version -m "staging/${bin_name}" | awk '$1=="mod"{print $3; exit}')"
          echo "Embedded module version: ${embedded}"
          if [ "${embedded}" != "${version}" ]; then
            echo "::error::Version mismatch: binary reports '${embedded}', tag is '${version}'"
            exit 1
          fi

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "bin_name=${bin_name}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test binary on target platform
        shell: bash
        run: |
          set -euo pipefail
          bin="staging/${{ steps.build.outputs.bin_name }}"

          # 1. help prints usage and exits cleanly.
          echo "::group::quill help"
          "${bin}" help
          echo "::endgroup::"

          # 2. version reports exactly the pushed tag.
          reported="$("${bin}" version)"
          echo "Reported version: ${reported}"
          if [ "${reported}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Version mismatch: binary reports '${reported}'"
            echo "::error::tag is '${GITHUB_REF_NAME}'"
            exit 1
          fi

          # 3. One repository check. The fixture enables only the security
          # pack's pure-Go committed-secret scan, which needs no external Tool,
          # so this runs identically on every platform (including Windows, where
          # not every declared Tool is installable). It is generated fresh under
          # the workspace and never checked in.
          smoke="smoke-repo"
          rm -rf "${smoke}"
          mkdir -p "${smoke}"

          cat >"${smoke}/STYLE.md" <<'STYLE'
          # Smoke style guide

          ## 1 Security

          ### 1.1 Secrets

          <!-- style: id=1.1.no-committed-secrets -->
          * Repositories MUST NOT commit secrets.
          STYLE

          cat >"${smoke}/quill.toml" <<'TOML'
          schema_version = 1

          [repository]
          root_markers = ["STYLE.md", "quill.toml"]
          default_scope = "all"
          excluded_directories = [".git"]
          generated_marker = "DO NOT EDIT."

          [repository.scope_roots]
          all = ["."]

          [style_guide]
          path = "STYLE.md"

          [packs]
          enabled = ["security"]

          [[rules]]
          id = "security/secrets"
          enforcement = "required"
          scope = "all"
          requirement_ids = ["1.1.no-committed-secrets"]
          TOML

          echo "::group::quill check (no-external-tool repository check)"
          "${bin}" check --repo-root "${smoke}"
          echo "::endgroup::"

          rm -rf "${smoke}"

      - name: Create archive (tar.gz)
        if: matrix.archive != 'zip'
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.build.outputs.archive }}"
          bin_name="${{ steps.build.outputs.bin_name }}"
          tar -czf "${archive}" -C staging "${bin_name}"
          ls -lh "${archive}"

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "${{ steps.build.outputs.archive }}"
          $binary = "staging\${{ steps.build.outputs.bin_name }}"
          Compress-Archive -Path $binary -DestinationPath "${archive}"
          Get-Item -Path "${archive}" | Format-List Name, Length

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quill-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify artefacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artefacts
          merge-multiple: true

      - name: Verify archive contents and checksum coverage
        run: |
          set -euo pipefail
          cd artefacts

          shopt -s nullglob
          archives=(*.tar.gz *.zip)

          echo "Found ${#archives[@]} archives:"
          printf '  %s\n' "${archives[@]}" | sort

          expected=5
          if [ "${#archives[@]}" -ne "${expected}" ]; then
            echo "::error::Expected ${expected} archives, found ${#archives[@]}"
            ls -la
            exit 1
          fi

          # 1. Every archive must contain exactly one entry: the quill executable.
          # 2. That entry must be a real executable of the expected OS class.
          for a in "${archives[@]}"; do
            case "$a" in
              *.tar.gz) members="$(tar tzf "$a")" ;;
              *.zip)    members="$(unzip -Z1 "$a")" ;;
              *) echo "::error::Unknown archive type: $a"; exit 1 ;;
            esac

            n="$(printf '%s\n' "$members" | grep -c . || true)"
            if [ "$n" -ne 1 ]; then
              echo "::error::$a: expected exactly one entry, found $n"
              printf '%s\n' "$members"
              exit 1
            fi

            entry="$(printf '%s\n' "$members" | head -n1)"
            case "$entry" in
              quill|quill.exe) echo "  $a -> single entry '$entry'" ;;
              *) echo "::error::$a: unexpected entry '$entry'"; exit 1 ;;
            esac

            tmp="$(mktemp -d)"
            case "$a" in
              *.tar.gz) tar xzf "$a" -C "$tmp" ;;
              *.zip)    unzip -q "$a" -d "$tmp" ;;
            esac
            magic="$(file -b "$tmp"/*)"
            rm -rf "$tmp"

            case "$a" in
              *_linux_*)   want="ELF" ;;
              *_darwin_*)  want="Mach-O" ;;
              *_windows_*) want="PE32+" ;;
            esac
            case "$magic" in
              *"$want"*) echo "  $a: file magic '$want' OK" ;;
              *) echo "::error::$a: unexpected file magic: $magic"; exit 1 ;;
            esac
          done

          # 3. SHA-256 checksums covering every archive, then round-trip verify.
          checksums="quill_${GITHUB_REF_NAME}_checksums.txt"
          sha256sum "${archives[@]}" > "${checksums}"
          echo "::group::SHA-256 checksums"
          cat "${checksums}"
          echo "::endgroup::"

          lines="$(grep -c . "${checksums}" || true)"
          if [ "$lines" -ne "${#archives[@]}" ]; then
            echo "::error::Checksum coverage mismatch: ${lines} checksums for"
            echo "::error::${#archives[@]} archives"
            exit 1
          fi
          sha256sum -c "${checksums}"

          echo "Verified ${#archives[@]} archives with full checksum coverage."

      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksums
          path: artefacts/quill_${{ github.ref_name }}_checksums.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading assets with --clobber."
            gh release upload "$tag" --repo "${GITHUB_REPOSITORY}" \
              *.tar.gz *.zip *_checksums.txt --clobber
          else
            gh release create "$tag" --repo "${GITHUB_REPOSITORY}" \
              --title "$tag" \
              --generate-notes \
              --verify-tag \
              *.tar.gz *.zip *_checksums.txt
          fi
          echo "Published release $tag with assets:"
          gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'
